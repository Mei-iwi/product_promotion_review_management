services:
  app:
    restart: unless-stopped
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
      MONGO_DB: ${MONGO_DB:-promotion_review_management}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      AVATAR_STORAGE_DIR: /app/instance/avatars
    volumes:
      - avatar_data:/app/instance/avatars
    ports:
      - "127.0.0.1:${FLASK_PORT:-5002}:5001"
volumes:
  avatar_data:
