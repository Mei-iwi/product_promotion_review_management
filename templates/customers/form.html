{% extends 'base.html' %}{% block title %}{{ 'Cập nhật' if item else 'Thêm' }} khách hàng{% endblock %}{% block content %}<div class="page-heading"><div><h1 class="h3">{{ 'Cập nhật khách hàng' if item else 'Thêm khách hàng' }}</h1><p>{{ 'Chỉnh sửa hồ sơ khách hàng' if item else 'Tạo hồ sơ khách hàng mới' }}</p></div><a class="btn btn-outline-secondary" href="{{ url_for('web.customer_detail', code=item.customerCode) if item else url_for('web.customers') }}">← Quay lại</a></div>
<form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-4"><label class="form-label">Mã khách hàng</label><input required class="form-control" name="customerCode" value="{{ item.customerCode if item else '' }}" {{ 'readonly' if item else '' }}></div><div class="col-md-8"><label class="form-label">Họ tên</label><input required class="form-control" name="fullName" value="{{ item.fullName if item else '' }}"></div>
<div class="col-md-6"><label class="form-label">Email</label><input required type="email" class="form-control" name="email" value="{{ item.email if item else '' }}"></div><div class="col-md-6"><label class="form-label">Địa chỉ</label><input class="form-control" name="address" value="{{ item.address if item else '' }}"></div>
<div class="col-md-4"><label class="form-label">Hạng</label><select class="form-select" name="level"><option value="normal">Thường</option><option value="silver" {{ 'selected' if item and item.level == 'silver' else '' }}>Bạc</option><option value="gold" {{ 'selected' if item and item.level == 'gold' else '' }}>Vàng</option></select></div><div class="col-md-4"><label class="form-label">Ngày tham gia</label><input type="datetime-local" class="form-control" name="joinedAt" value="{{ item.joinedAt.strftime('%Y-%m-%dT%H:%M') if item else '' }}"></div><div class="col-md-4"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="active">Đang hoạt động</option><option value="inactive" {{ 'selected' if item and item.status == 'inactive' else '' }}>Ngừng hoạt động</option></select></div><div class="d-flex gap-2"><button class="btn btn-primary">Lưu thay đổi</button><a class="btn btn-outline-secondary" href="{{ url_for('web.customer_detail', code=item.customerCode) if item else url_for('web.customers') }}">Hủy</a></div></form>{% endblock %}
