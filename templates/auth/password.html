{% extends 'base.html' %}{% block title %}Đổi mật khẩu{% endblock %}{% block content %}
<h1 class="h3">Đổi mật khẩu</h1><p>Sử dụng cụm từ dài 8–128 ký tự, tránh thông tin định danh. Đổi mật khẩu sẽ đăng xuất mọi phiên.</p>
<form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-6"><label class="form-label" for="current">Mật khẩu hiện tại</label><input id="current" class="form-control" name="currentPassword" type="password" autocomplete="current-password" required></div>
<div class="col-md-6"><label class="form-label" for="new">Mật khẩu mới</label><input id="new" class="form-control" name="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
<div><button class="btn btn-primary">Đổi mật khẩu và đăng xuất</button></div></form>{% endblock %}
