{% if password_error %}<div class="alert alert-danger" role="alert">{{ password_error }}</div>{% endif %}
<form id="password-form" method="post" action="{{ url_for('auth.change_password') }}" data-async-form data-form-kind="password" class="password-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% for id,name,label,auto in [('current','currentPassword','Mật khẩu hiện tại','current-password'),('new','newPassword','Mật khẩu mới','new-password'),('confirm','confirmPassword','Xác nhận mật khẩu mới','new-password')] %}
  <div class="password-input-group"><label class="form-label" for="{{ id }}">{{ label }} <span class="required-marker" aria-hidden="true">*</span></label>
  <div class="password-field"><input id="{{ id }}" class="form-control" name="{{ name }}" type="password" autocomplete="{{ auto }}" maxlength="128" {% if name != 'currentPassword' %}minlength="8"{% endif %} required><button type="button" class="password-toggle" data-password-toggle="{{ id }}" data-password-label="{{ label|lower }}" aria-controls="{{ id }}" aria-pressed="false" aria-label="Hiện {{ label|lower }}">Hiện</button></div></div>
  {% endfor %}
  <div class="form-status mb-3" data-form-status role="status" aria-live="polite" hidden></div>
  <button type="submit" class="btn btn-primary w-100">Cập nhật mật khẩu</button>
</form>
